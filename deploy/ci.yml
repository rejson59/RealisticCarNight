name: CI

# SZABLON — skopiuj do .github/workflows/ci.yml.
# Weryfikacja przy każdym PR i każdym pushu: testy, shadery, lint, build
# oraz strażnik ścieżek względnych (bez tego GitHub Pages w podkatalogu 404).

on:
  pull_request:
  push:
    branches: [main, 'arena/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (test/boot.mjs) wymaga Node >= 22.22
          node-version: 22
          cache: npm

      - name: Zależności
        run: npm ci

      - name: Testy (miasto, fizyka, AI, potok renderowania, realny boot gry)
        run: npm test

      - name: Walidacja shaderów GLSL ES 3.00
        run: |
          npm i --no-save --no-audit --no-fund glslang-validator-prebuilt-predownloaded
          chmod +x node_modules/glslang-validator-prebuilt-predownloaded/bin/glslangValidator.linux
          npm run test:glsl

      - name: Lint
        run: npm run lint

      - name: Build + sprawdzenie ścieżek względnych
        run: |
          npm run build
          # Strona żyje pod https://<user>.github.io/RealisticCarNight/, więc każdy
          # odnośnik musi być względny ("./assets/..."). Ścieżka absolutna
          # ("/assets/...") daje białą stronę z samym tekstem.
          if grep -qE '(src|href)="/[^/]' dist/index.html; then
            echo "::error::dist/index.html zawiera ścieżki absolutne — vite.config.js musi mieć base: './'"
            grep -nE '(src|href)="/[^/]' dist/index.html
            exit 1
          fi
          test -f dist/.nojekyll || { echo "::error::brak dist/.nojekyll"; exit 1; }
          echo "OK: wszystkie odnośniki w dist/index.html są względne"
          ls -1 dist dist/assets
